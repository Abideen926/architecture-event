  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

\n<\u002Fhelmet>\n\n<div style=\"min-height: 100vh; background: #FFFFFF; font-size: 16px; line-height: 1.6;\">\n\n  <header style=\"position: sticky; top: 0; z-index: 50; background: rgba(255,255,255,0.94); backdrop-filter: saturate(1.2) blur(8px); border-bottom: 1px solid #E7E7E7;\">\n    <div data-pad=\"\" style=\"max-width: 1440px; margin: 0 auto; height: 76px; display: flex; align-items: center; gap: 32px;\">\n      <a href=\"#home\" style=\"display: flex; align-items: center; gap: 12px;\">\n        <span style=\"font-family: 'Playfair Display', serif; font-size: 34px; line-height: 1; color: var(--accent);\">A<\u002Fspan>\n        <span style=\"text-align: left; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; line-height: 1.25; color: #202020;\">ARCHITECTURE<br>EVENTS<\u002Fspan>\n      <\u002Fa>\n      <div style=\"margin-left: auto; display: flex; align-items: center; gap: 24px;\">\n        <a data-marketing=\"\" href=\"#events\" style=\"font-size: 14.5px; font-weight: 500; color: #202020;\" style-hover=\"color: var(--accent);\">Browse Events<\u002Fa>\n        <span data-marketing=\"\" style=\"width: 1px; height: 26px; background: #E7E7E7;\"><\u002Fspan>\n        <div style=\"display: flex; align-items: center; gap: 11px;\">\n          <span style=\"width: 34px; height: 34px; border-radius: 50%; background: #F1EEE8; border: 1px solid #E7E7E7; display: flex; align-items: center; justify-content: center; font-size: 12.5px; font-weight: 700; letter-spacing: 0.04em; color: #3A3A3A;\">NF<\u002Fspan>\n          <span data-marketing=\"\" style=\"font-size: 14.5px; font-weight: 600; color: #202020;\">Northline Forum<\u002Fspan>\n        <\u002Fdiv>\n        <button style=\"background: none; border: 0; padding: 0; font-size: 14.5px; font-weight: 500; color: #6A6A6A;\" style-hover=\"color: var(--accent);\">Log Out<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <main data-pad=\"\" style=\"max-width: 1440px; margin: 0 auto; padding-top: 30px; padding-bottom: 90px;\">\n\n    <div>\n      <p style=\"margin: 0 0 7px; font-size: 11.5px; font-weight: 700; letter-spacing: 0.16em; color: var(--accent);\">ORGANIZER ACCOUNT<\u002Fp>\n      <h1 style=\"margin: 0; font-family: 'Playfair Display', serif; font-weight: 600; font-size: 46px; line-height: 1.08; letter-spacing: -0.02em;\">Your listings<\u002Fh1>\n      <p style=\"margin: 10px 0 24px; max-width: 68ch; font-size: 16.5px; line-height: 1.6; color: #6A6A6A;\">Submit and manage your events, track their status, and keep your organization details up to date.<\u002Fp>\n    <\u002Fdiv>\n\n    <div data-shell=\"\">\n      <aside data-side=\"\">\n        <nav data-nav=\"\">\n          <button sc-camel-on-click=\"{{ goListings }}\" style=\"display: flex; align-items: center; gap: 12px; white-space: nowrap; text-align: left; border: 0; border-radius: 12px; padding: 13px 16px; font-size: 14.5px; background: {{ listBg }}; color: {{ listFg }}; font-weight: {{ listFw }};\" style-hover=\"background: #F1EEE8;\">\n            <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"><rect x=\"4\" y=\"4\" width=\"16\" height=\"16\" rx=\"2\"><\u002Frect><path d=\"M8 9.5h8M8 14h5\"><\u002Fpath><\u002Fsvg>\n            My Listings\n          <\u002Fbutton>\n          <button sc-camel-on-click=\"{{ goSubmit }}\" style=\"display: flex; align-items: center; gap: 12px; white-space: nowrap; text-align: left; border: 0; border-radius: 12px; padding: 13px 16px; font-size: 14.5px; background: {{ subBg }}; color: {{ subFg }}; font-weight: {{ subFw }};\" style-hover=\"background: #F1EEE8;\">\n            <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"><path d=\"M12 5v14M5 12h14\"><\u002Fpath><\u002Fsvg>\n            Submit New Event\n          <\u002Fbutton>\n          <button sc-camel-on-click=\"{{ goAccount }}\" style=\"display: flex; align- 0px rgba(20,20,20,0.4); border-color: #D9D9D9;\">\n                <div data-listing=\"\">\n                  <div>\n                    <p style=\"margin: 0 0 3px; font-size: 10.5px; font-weight: 700; letter-spacing: 0.13em; color: #6A6A6A;\">{{ l.cat }}<\u002Fp>\n                    <h3 style=\"margin: 0; font-size: 18px; font-weight: 700; line-height: 1.22; letter-spacing: -0.01em;\">{{ l.title }}<\u002Fh3>\n                    <p style=\"margin: 4px 0 0; font-size: 13.5px; line-height: 1.45; color: #6A6A6A;\">{{ l.meta }}<\u002Fp>\n                  <\u002Fdiv>\n                  <span style=\"justify-self: start; white-space: nowrap; border-radius: 999px; padding: 7px 15px; font-size: 12.5px; font-weight: 600; background: {{ l.pillBg }}; color: {{ l.pillFg }}; border: 1px solid {{ l.pillBorder }};\">{{ l.status }}<\u002Fspan>\n                  <span style=\"display: flex; align-items: center; gap: 18px;\">\n                    <sc-if value=\"{{ l.isPublished }}\">\n                      <a href=\"#event\" style=\"font-size: 13.5px; font-weight: 600;\">View live page →<\u002Fa>\n                    <\u002Fsc-if>\n                    <span style=\"font-size: 13.5px; font-weight: 600; color: #6A6A6A;\">Edit<\u002Fspan>\n                  <\u002Fspan>\n                <\u002Fdiv>\n                <sc-if value=\"{{ l.hasNote }}\">\n                  <div style=\"margin-top: 14px; padding: 12px 16px; background: #F1EEE8; border: 1px solid #E7E7E7; border-radius: 12px; display: flex; gap: 12px; align-items: flex-start;\">\n                    <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#B08A45\" stroke-width=\"1.7\" style=\"flex: 0 0 auto; margin-top: 3px;\"><circle cx=\"12\" cy=\"12\" r=\"8.5\"><\u002Fcircle><path d=\"M12 8.2v5.2M12 16.4h.01\"><\u002Fpath><\u002Fsvg>\n                    <p style=\"margin: 0; font-size: 14.5px; line-height: 1.65; color: #3A3A3A;\">{{ l.note }}<\u002Fp>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Farticle>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ noListings }}\">\n          <div style=\"margin-top: 26px; background: #FAFAFA; border: 1px solid #E7E7E7; border-radius: 20px; padding: 76px 40px; text-align: center;\">\n            <span style=\"display: inline-flex; width: 52px; height: 52px; border-radius: 50%; background: #F1EEE8; border: 1px solid #E7E7E7; align-items: center; justify-content: center; color: var(--accent);\">\n              <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"><rect x=\"4\" y=\"4\" width=\"16\" height=\"16\" rx=\"2\"><\u002Frect><path d=\"M12 9v6M9 12h6\"><\u002Fpath><\u002Fsvg>\n            <\u002Fspan>\n            <h3 style=\"margin: 22px 0 0; font-family: 'Playfair Display', serif; font-weight: 600; font-size: 27px; letter-spacing: -0.015em;\">No listings yet<\u002Fh3>\n            <p style=\"margin: 13px auto 0; max-width: 48ch; font-size: 16px; line-height: 1.75; color: #6A6A6A;\">Submit your first event and it will appear here with its review status as it moves through editorial.<\u002Fp>\n            <button sc-camel-on-click=\"{{ goSubmit }}\" style=\"margin-top: 28px; border: 0; border-radius: 12px; background: #1E1E1E; color: #fff; padding: 15px 28px; font-size: 15px; font-weight: 600;\" style-hover=\"background: #000;\">Submit New Event<\u002Fbutton>\n          <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isSubmit }}\">\n        <div style=\"animation: aeFade .35s ease both; max-width: 860px;\">\n\n          <div style=\"padding-bottom: 20px; border-bottom: 1px solid #E7E7E7;\">\n            <h2 style=\"margin: 0; font-family: 'Playfair Display', serif; font-weight: 600; font-size: 30px; letter-spacing: -0.015em;\">Submit New Event<\u002Fh2>\n            <p style=\"margin: 10px 0 0; font-size: 14.5px; color: #6A6A6A;\">{{ stepLabel }}<\u002Fp>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ isStepPackage }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"margin-top: 30px;\">\n            <h3 style=\"margin: 0; font-family: 'Playfair Display', serif; font-weight: 600; font-size: 24px; letter-spacing: -0.01em;\">Choose a listing package<\u002Fh3>\n            <p style=\"margin: 10px 0 26px; max-width: 62ch; font-size: 15.5px; line-height: 1.75; color: #6A6A6A;\">Pick a package to open the submission form. You can change it before you submit.<\u002Fp>\n            <div data-packages=\"\">\n              <article style=\"border: 1px solid #E7E7E7; border-radius: 20px; padding: 32px; background: #fff; display: flex; flex-direction: column;\" style-hover=\"border-color: #202020;\">\n                <p style=\"margin: 0; font-size: 10.5px; font-weight: 700; letter-spacing: 0.13em; color: #6A6A6A;\">BASIC LISTING<\u002Fp>\n                <p style=\"margin: 14px 0 0; font-family: 'Playfair Display', serif; font-size: 38px; font-weight: 600; letter-spacing: -0.02em;\">Free<\u002Fp>\n                <ul style=\"margin: 24px 0 0; padding: 24px 0 0; border-top: 1px solid #E7E7E7; list-style: none; display: grid; gap: 13px;\">\n                  <li style=\"display: flex; gap: 11px; font-size: 15px; line-height: 1.6; color: #3A3A3A;\"><svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"2\" style=\"flex: 0 0 auto; margin-top: 5px;\"><path d=\"M4 12.5 9.5 18 20 7\"><\u002Fpath><\u002Fsvg>Standard directory listing<\u002Fli>\n                  <li style=\"display: flex; gap: 11px; font-size: 15px; line-height: 1.6; color: #3A3A3A;\"><svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"2\" style=\"flex: 0 0 auto; margin-top: 5px;\"><path d=\"M4 12.5 9.5 18 20 7\"><\u002Fpath><\u002Fsvg>Appears in category and city filters<\u002Fli>\n                  <li style=\"display: flex; gap: 11px; font-size: 15px; line-height: 1.6; color: #3A3A3A;\"><svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"2\" style=\"flex: 0 0 auto; margin-top: 5px;\"><path d=\"M4 12.5 9.5 18 20 7\"><\u002Fpath><\u002Fsvg>Linked registration button<\u002Fli>\n                  <li style=\"display: flex; gap: 11px; font-size: 15px; line-height: 1.6; color: #3A3A3A;\"><svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"2\" style=\"flex: 0 0 auto; margin-top: 5px;\"><path d=\"M4 12.5 9.5 18 20 7\"><\u002Fpath><\u002Fsvg>Visible until the event date<\u002Fli>\n                <\u002Ful>\n                <button sc-camel-on-click=\"{{ pickBasic }}\" style=\"margin-top: 28px; align-self: start; border: 1px solid #202020; background: #fff; border-radius: 12px; padding: 14px 24px; font-size: 14.5px; font-weight: 600; color: #202020;\" style-hover=\"background: #FAFAFA;\">Select Basic<\u002Fbutton>\n              <\u002Farticle>\n              <article style=\"border: 1px solid #202020; border-radius: 20px; padding: 32px; background: #FAFAFA; display: flex; flex-direction: column;\">\n                <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 12px;\">\n                  <p style=\"margin: 0; font-size: 10.5px; font-weight: 700; letter-spacing: 0.13em; color: #6A6A6A;\">FEATURED LISTING<\u002Fp>\n                  <span style=\"background: var(--accent); color: #fff; border-radius: 999px; padding: 5px 12px; font-size: 10.5px; font-weight: 700; letter-spacing: 0.1em;\">FEATURED<\u002Fspan>\n                <\u002Fdiv>\n                <p style=\"margin: 14px 0 0; font-family: 'Playfair Display', serif; font-size: 38px; font-weight: 600; letter-spacing: -0.02em;\">$49<\u002Fp>\n                <ul style=\"margin: 24px 0 0; padding: 24px 0 0; border-top: 1px solid #E7E7E7; list-style: none; display: grid; gap: 13px;\">\n                  <li style=\"display: flex; gap: 11px; font-size: 15px; line-height: 1.6; color: #3A3A3A;\"><svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"2\" style=\"flex: 0 0 auto; margin-top: 5px;\"><path d=\"M4 12.5 9.5 18 20 7\"><\u002Fpath><\u002Fsvg>Everything in Basic<\u002Fli>\n                  <li style=\"display: flex; gap: 11px; font-size: 15px; line-height: 1.6; color: #3A3A3A;\"><svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"2\" style=\"flex: 0 0 auto; margin-top: 5px;\"><path d=\"M4 12.5 9.5 18 20 7\"><\u002Fpath><\u002Fsvg>Placement near the top of the Events page<\u002Fli>\n                  <li style=\"display: flex; gap: 11px; font-size: 15px; line-height: 1.6; color: #3A3A3A;\"><svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"2\" style=\"flex: 0 0 auto; margin-top: 5px;\"><path d=\"M4 12.5 9.5 18 20 7\"><\u002Fpath><\u002Fsvg>A \"Featured\" badge on your listing<\u002Fli>\n                <\u002Ful>\n                <button sc-camel-on-click=\"{{ pickFeatured }}\" style=\"margin-top: 28px; align-self: start; border: 0; border-radius: 12px; background: #1E1E1E; color: #fff; padding: 14px 24px; font-size: 14.5px; font-weight: 600;\" style-hover=\"background: #000;\">Select Featured<\u002Fbutton>\n              <\u002Farticle>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ isStepForm }}\">\n          <div style=\"margin-top: 30px;\">\n            <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 18px 22px; background: #FAFAFA; border: 1px solid #E7E7E7; border-radius: 16px; flex-wrap: wrap;\">\n              <p style=\"margin: 0; font-size: 14.5px; color: #3A3A3A;\">Package: <strong style=\"font-weight: 700;\">{{ packageLabel }}<\u002Fstrong><\u002Fp>\n              <button sc-camel-on-click=\"{{ backToPackage }}\" style=\"background: none; border: 0; padding: 0; font-size: 14px; font-weight: 600; color: var(--accent);\" style-hover=\"color: #94733a;\">Change package<\u002Fbutton>\n            <\u002Fdiv>\n\n            <sc-if value=\"{{ isFeatured }}\">\n              <p style=\"margin: 16px 0 0; padding: 15px 18px; border: 1px solid #E7E7E7; border-radius: 12px; font-size: 14px; line-height: 1.65; color: #6A6A6A;\">Payment for the Featured Listing is processed only after editorial approval — nothing is charged when you submit.<\u002Fp>\n            <\u002Fsc-if>\n\n            <div style=\"margin-top: 26px; border: 1px solid #E7E7E7; border-radius: 20px; padding: 36px;\">\n              <h3 style=\"margin: 0 0 22px; font-family: 'Playfair Display', serif; font-weight: 600; font-size: 22px; letter-spacing: -0.01em;\">Event details<\u002Fh3>\n              <div style=\"display: grid; gap: 18px;\">\n                <label style=\"display: block;\"><span style=\"display: block; font-size: 13.5px; font-weight: 600; margin-bottom: 9px;\">Event name<\u002Fspan><input type=\"text\" placeholder=\"e.g. Facade Systems Summit 2026\" style=\"width: 100%; height: 52px; border: 1px solid #E7E7E7; border-radius: 12px; padding: 0 16px; font-size: 15px; outline: none;\"><\u002Flabel>\n                <div data-2col=\"\">\n                  <label style=\"display: block;\"><span style=\"display: block; font-size: 13.5px; font-weight: 600; margin-bottom: 9px;\">Category<\u002Fspan>\n                    <sc-raw-select style=\"width: 100%; height: 52px; border: 1px solid #E7E7E7; border-radius: 12px; padding: 0 14px; font-size: 15px; background: #fff; color: #202020;\">\n                      <option>Conference<\u002Foption>\n                      <option>Product Showcase<\u002Foption>\n                      <option>Education / C "text\" sc-camel-default-value=\"Northline Forum\" style=\"width: 100%; height: 52px; border: 1px solid #E7E7E7; border-radius: 12px; padding: 0 16px; font-size: 15px; outline: none;\"><\u002Flabel>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"margin-top: 34px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center;\">\n                <button sc-camel-on-click=\"{{ submitEvent }}\" style=\"border: 0; border-radius: 12px; background: #1E1E1E; color: #fff; padding: 15px 28px; font-size: 15px; font-weight: 600;\" style-hover=\"background: #000;\">Submit for Review<\u002Fbutton>\n                <button style=\"border: 1px solid #202020; background: #fff; border-radius: 12px; padding: 15px 26px; font-size: 15px; font-weight: 600; color: #202020;\" style-hover=\"background: #FAFAFA;\">Save as Draft<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ isStepDone }}\">\n          <div style=\"margin-top: 30px; background: #FAFAFA; border: 1px solid #E7E7E7; border-radius: 20px; padding: 66px 44px; text-align: center; animation: aeFade .35s ease both;\">\n            <span style=\"display: inline-flex; width: 56px; height: 56px; border-radius: 50%; background: #1E1E1E; align-items: center; justify-content: center; color: #fff;\">\n              <svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M4 12.5 9.5 18 20 7\"><\u002Fpath><\u002Fsvg>\n            <\u002Fspan>\n            <h3 style=\"margin: 24px 0 0; font-family: 'Playfair Display', serif; font-weight: 600; font-size: 29px; letter-spacing: -0.015em;\">Your event has been submitted<\u002Fh3>\n            <p style=\"margin: 14px auto 0; max-width: 52ch; font-size: 16px; line-height: 1.75; color: #6A6A6A;\">It is now under review. You'll receive a confirmation email shortly, and the status on your list \u002Flabel>\n              <div style=\"display: flex; gap: 12px; flex-wrap: wrap;\">\n                <button sc-camel-on-click=\"{{ sendPartner }}\" style=\"border: 0; border-radius: 12px; background: #1E1E1E; color: #fff; padding: 15px 26px; font-size: 15px; font-weight: 600;\" style-hover=\"background: #000;\">Send request<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ closePartner }}\" style=\"border: 1px solid #202020; background: #fff; border-radius: 12px; padding: 15px 26px; font-size: 15px; font-weight: 600; color: #202020;\" style-hover=\"background: #FAFAFA;\">Cancel<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ partnerSent }}\">\n            <div style=\"margin-top: 24px; padding: 20px 22px; background: #F1EEE8; border: 1px solid #E7E7E7; border-radius: 16px; display: flex; gap: 12px; align-items: flex-start; animation: aeFade .3s ease both;\">\n              <svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#B08A45\" stroke-width=\"2\" style=\"flex: 0 0 auto; margin-top: 4px;\"><path d=\"M4 12.5 9.5 18 20 7\"><\u002Fpath><\u002Fsvg>\n              <p style=\"margin: 0; font-size: 15px; line-height: 1.7; color: #3A3A3A;\">Request sent. The Architecture Events team will follow up by email within a few business days.<\u002Fp>\n            <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n\n          <div style=\"margin-top: 26px; padding-top: 22px; border-top: 1px solid #E7E7E7; display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap;\">\n            <p style=\"margin: 0; font-size: 14.5px; color: #6A6A6A;\">Signed in as daniel@northlineforum.com<\u002Fp>\n            <button style=\"background: none; border: 0; padding: 0; font-size: 14.5px; font-weight: 600; color: var(--accent);\" style-hover=\"color: #94733a;\">Log out<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n\n      <\u002Fsection>\n    <\u002Fdiv>\n  <\u002Fmain>\n\n  <footer style=\"background: #1E1E1E; color: rgba(255,255,255,0.72);\">\n    <div data-pad=\"\" style=\"max-width: 1440px; margin: 0 auto; padding-top: 44px; padding-bottom: 44px; display: flex; align-items: center; justify-content: space-between; gap: 28px; flex-wrap: wrap;\">\n      <div style=\"display: flex; align-items: center; gap: 12px;\">\n        <span style=\"font-family: 'Playfair Display', serif; font-size: 30px; line-height: 1; color: var(--accent);\">A<\u002Fspan>\n        <span style=\"font-size: 12px; font-weight: 700; letter-spacing: 0.14em; line-height: 1.25; color: #fff;\">ARCHITECTURE<br>EVENTS<\u002Fspan>\n      <\u002Fdiv>\n      <p style=\"margin: 0; font-size: 13.5px;\">© 2026 Architecture Events. All rights reserved.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;startTab&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;listings&quot;,&quot;submit&quot;,&quot;account&quot;],&quot;default&quot;:&quot;listings&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Demo state&quot;},&quot;startStep&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;package&quot;,&quot;form&quot;,&quot;done&quot;],&quot;default&quot;:&quot;package&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Demo state&quot;},&quot;listingsEmpty&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Demo state&quot;}}\">\nclass Component extends DCLogic {\n  state = {\n    tab: this.props.startTab || 'listings',\n    step: this.props.startStep || 'package',\n    pkg: 'Featured Listing — $49',\n    thumb: 0,\n    partner: 'closed'\n  };\n\n  listings = [\n    { cat: 'CONFERENCE', title: 'Facade Systems Summit 2026', meta: 'Submitted Jul 14, 2026 · Sep 14, 2026 · New York, NY', status: 'Published' },\n    { cat: 'EDUCATION · CEU', title: 'Daylighting and Glazing Performance', meta: 'Submitted Jul 22, 2026 · Oct 8, 2026 · Chicago, IL', status: 'Under Review' },\n    { cat: 'PRODUCT SHOWCASE', title: 'Mass Timber & Low-Carbon Structures', meta: 'Submitted Jul 26, 2026 · Sep 29, 2026 · Portland, OR', status: 'Changes Requested', note: 'Admin has requested changes to the event description — please add the session schedule and confirm the CEU credit count.' },\n    { cat: 'NETWORKING', title: 'AEC Practice Leaders Dinner', meta: 'Submitted Jul 28, 2026 · Oct 21, 2026 · Boston, MA', status: 'Submitted' },\n    { cat: 'EXHIBITION', title: 'Interior Materials Week', meta: 'Not yet submitted · Nov 17, 2026 · Online', status: 'Draft' },\n    { cat: 'CONFERENCE', title: 'Regional Contractors Expo', meta: 'Submitted Jun 30, 2026 · Aug 19, 2026 · Newark, NJ', status: 'Rejected', note: 'Not approved — the listing duplicates an existing published event. Reply to the review email if you believe this was a mistake.' }\n  ];\n\n  uploadImgs = [1,3,5].map(n => (window.__resources && window.__resources['ev'+n]) || ('assets/ev'+n+'.jpg'));\n\n  pill(status) {\n    if (status === 'Published') return { pillBg: '#1E1E1E', pillFg: '#fff', pillBorder: '#202020' };\n    if (status === 'Under Review' || status === 'Submitted') return { pillBg: '#F1EEE8', pillFg: '#3A3A3A', pillBorder: '#E7E7E7' };\n    if (status === 'Changes Requested') return { pillBg: '#fff', pillFg: '#B08A45', pillBorder: '#B08A45' };\n    if (status === 'Rejected') return { pillBg: '#fff', pillFg: '#6A6A6A', pillBorder: '#C9C9C9' };\n    return { pillBg: '#F1F1F1', pillFg: '#6A6A6A', pillBorder: '#E7E7E7' };\n  }\n\n  go(tab) { this.setState({ tab: tab }); if (typeof window !== 'undefined') window.scrollTo(0, 0); }\n\n  renderVals() {\n    const t = this.state.tab, st = this.state.step;\n    const act = { bg: '#F1EEE8', fg: '#202020', fw: '600' };\n    const idle = { bg: 'transparent', fg: '#6A6A6A', fw: '500' };\n    const a = t === 'listings' ? act : idle, b = t === 'submit' ? act : idle, c = t === 'account' ? act : idle;\n    const rows = this.props.listingsEmpty ? [] : this.listings;\n    const stepLabels = { package: 'Step 1 of 2 — choose your listing package', form: 'Step 2 of 2 — event details', done: 'Submitted for review' };\n    return {\n      isListings: t === 'listings', isSubmit: t === 'submit', isAccount: t === 'account',\n      goListings: () => this.go('listings'),\n      goSubmit: () => { this.setState({ step: 'package' }); this.go('submit'); },\n      goAccount: () => this.go('account'),\n      listBg: a.bg, listFg: a.fg, listFw: a.fw,\n      subBg: b.bg, subFg: b.fg, subFw: b.fw,\n      accBg: c.bg, accFg: c.fg, accFw: c.fw,\n      listings: rows.map(r => Object.assign({}, r, this.pill(r.status), {\n        isPublished: r.status === 'Published',\n        hasNote: !!r.note,\n        open: () => this.setState({ tab: 'submit', step: 'form' })\n      })),\n      hasListings: rows.length > 0,\n      noListings: rows.length === 0,\n      listingsCountLabel: rows.length === 0 ? 'No listings yet' : rows.length + ' listings · 1 published',\n      isStepPackage: st === 'package', isStepForm: st === 'form', isStepDone: st === 'done',\n      stepLabel: stepLabels[st],\n      packageLabel: this.state.pkg,\n      isFeatured: this.state.pkg.indexOf('Featured') === 0,\n      pickBasic: () => this.setState({ pkg: 'Basic Listing — Free', step: 'form' }),\n      pickFeatured: () => this.setState({ pkg: 'Featured Listing — $49', step: 'form' }),\n      backToPackage: () => this.setState({ step: 'package' }),\n      submitEvent: () => { this.setState({ step: 'done' }); if (typeof window !== 'undefined') window.scrollTo(0, 0); },\n      uploads: this.uploadImgs.map((img, i) => ({\n        img: img,\n        border: this.state.thumb === i ? '#1E1E1E' : '#E7E7E7',\n        badge: this.state.thumb === i ? 'THUMBNAIL' : 'SET AS THUMB',\n        badgeBg: this.state.thumb === i ? '#1E1E1E' : 'rgba(255,255,255,0.92)',\n        badgeFg: this.state.thumb === i ? '#fff' : '#3A3A3A',\n        pick: () => this.setState({ thumb: i })\n      })),\n      partnerClosed: this.state.partner === 'closed',\n      partnerOpen: this.state.partner === 'open',\n      partnerSent: this.state.partner === 'sent',\n      openPartner: () => this.setState({ partner: 'open' }),\n      closePartner: () => this.setState({ partner: 'closed' }),\n      sendPartner: () => this.setState({ partner: 'sent' })\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
