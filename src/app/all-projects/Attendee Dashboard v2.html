document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

100%; object-fit: cover;\">\n                  <div style=\"position: absolute; top: 14px; left: 14px; background: #1E1E1E; color: #fff; border-radius: 12px; padding: 9px 14px; text-align: center;\">\n                    <div style=\"font-size: 10px; font-weight: 700; letter-spacing: 0.1em;\">{{ ev.mon }}<\u002Fdiv>\n                    <div style=\"font-size: 17px; font-weight: 700; line-height: 1.15;\">{{ ev.day }}<\u002Fdiv>\n                    <div style=\"font-size: 10px; color: rgba(255,255,255,0.7);\">{{ ev.year }}<\u002Fdiv>\n                  <\u002Fdiv>\n                  <button sc-camel-on-click=\"{{ ev.remove }}\" title=\"Remove from saved\" style=\"position: absolute; top: 14px; right: 14px; width: 34px; height: 34px; border: 0; border-radius: 50%; background: rgba(255,255,255,0.92); display: flex; align-items: center; justify-content: center; color: var(--accent);\" style-hover=\"background: #1E1E1E; color: #fff;\">\n                    <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"currentColor\" stroke=\"currentColor\" stroke-width=\"1.6\"><path d=\"M6 4h12v17l-6-4.5L6 21z\"><\u002Fpath><\u002Fsvg>\n                  <\u002Fbutton>\n                <\u002Fdiv>\n                <div style=\"padding: 15px 18px; border-top: 1px solid #F1F1F1;\">\n                  <p style=\"margin: 0 0 6px; font-size: 10.5px; font-weight: 700; letter-spacing: 0.13em; color: #6A6A6A;\">{{ ev.cat }}<\u002Fp>\n                  <h3 style=\"margin: 0; font-size: 18px; font-weight: 700; line-height: 1.22; letter-spacing: -0.01em;\">{{ ev.title }}<\u002Fh3>\n                  <div style=\"margin-top: 11px; padding-top: 11px; border-top: 1px solid #F1F1F1; display: flex; align-items: center; justify-content: space-between; gap: 12px;\">\n                    <span style=\"display: flex; align-items: center; gap: 7px; font-size: 13.5px; color: #6A6A6A;\">\n                      <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#6A6A6A\" stroke-width=\"1.7\"><path d=\"M12 21s7-6.1 7-11a7 7 0 1 0-14 0c0 4.9 7 11 7 11z\"><\u002Fpath><circle cx=\"12\" cy=\"10\" r=\"2.6\"><\u002Fcircle><\u002Fsvg>\n                      {{ ev.city }}\n                    <\u002Fspan>\n                    <button sc-camel-on-click=\"{{ ev.remove }}\" style=\"background: none; border: 0; padding: 0; font-size: 13.5px; font-weight: 600; color: #6A6A6A;\" style-hover=\"color: var(--accent);\">Remove<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Farticle>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ noSaved }}\">\n          <div style=\"margin-top: 30px; background: #FAFAFA; border: 1px solid #E7E7E7; border-radius: 20px; padding: 76px 40px; text-align: center; animation: aeFade .35s ease both;\">\n            <span style=\"display: inline-flex; width: 52px; height: 52px; border-radius: 50%; background: #F1EEE8; border: 1px solid #E7E7E7; align-items: center; justify-content: center; color: var(--accent);\">\n              <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"><path d=\"M6 4h12v17l-6-4.5L6 21z\"><\u002Fpath><\u002Fsvg>\n            <\u002Fspan>\n            <h3 style=\"margin: 22px 0 0; font-family: 'Playfair Display', serif; font-weight: 600; font-size: 27px; letter-spacing: -0.015em;\">Nothing saved yet<\u002Fh3>\n            <p style=\"margin: 13px auto 0; max-width: 46ch; font-size: 16px; line-height: 1.75; color: #6A6A6A;\">Tap the bookmark on any event and it will wait for you here — with a reminder before registration closes.<\u002Fp>\n            <a href=\"#events\" style=\"display: inline-block; margin-top: 28px; background: #1E1E1E; color: #fff; border-radius: 12px; padding: 15px 28px; font-size: 15px; font-weight: 600;\" style-hover=\"background: #000;\">Browse Events<\u002Fa>\n          <\u002Fdiv>\ argin-bottom: 9px;\">Role <span style=\"font-weight: 500; color: #6A6A6A;\">— optional<\u002Fspan><\u002Fspan>\n                <sc-raw-select value=\"{{ role }}\" sc-camel-on-change=\"{{ setRole }}\" style=\"width: 100%; height: 52px; border: 1px solid #E7E7E7; border-radius: 12px; padding: 0 14px; font-size: 15px; background: #fff; color: #202020;\">\n                  <option>Prefer not to say<\u002Foption>\n                  <option>Architect<\u002Foption>\n                  <option>Engineer<\u002Foption>\n                  <option>Interior Designer<\u002Foption>\n                  <option>Contractor<\u002Foption>\n                  <option>Developer<\u002Foption>\n                  <option>Manufacturer<\u002Foption>\n                  <option>Consultant<\u002Foption>\n                  <option>BIM / VDC<\u002Foption>\n                  <option>Student<\u002Foption>\n                <\u002Fsc-raw-select>\n              <\u002Flabel>\n            <\u002Fdiv>\n\n            <div style=\"margin-top: 32px; padding-top: 28px; border-top: 1px solid #E7E7E7;\">\n              <h3 style=\"margin: 0; font-size: 15px; font-weight: 700;\">Categories you follow <span style=\"font-weight: 500; color: #6A6A6A;\">— optional<\u002Fspan><\u002Fh3>\n              <p style=\"margin: 8px 0 0; font-size: 14px; color: #6A6A6A;\">Tap to add or remove. Changes save as you go.<\u002Fp>\n              <div style=\"margin-top: 16px; display: flex; flex-wrap: wrap; gap: 10px;\">\n                <sc-for list=\"{{ categories }}\" as=\"c\" hint-placeholder-count=\"8\">\n                  <button sc-camel-on-click=\"{{ c.toggle }}\" style=\"border: 1px solid {{ c.border }}; background: {{ c.bg }}; color: {{ c.fg }}; border-radius: 999px; padding: 10px 18px; font-size: 14px;\" style-hover=\"border-color: #202020;\">{{ c.label }}<\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"margin-top: 28px;\">\n              <h3 style=\"margin: 0; font-size: 15px; font-weight: 700;\">Regions and cities you follow <span style=\"font-weight: 500; color: #6A6A6A;\">— optional<\u002Fspan><\u002Fh3>\n              <div style=\"margin-top: 16px; display: flex; flex-wrap: wrap; gap: 10px;\">\n                <sc-for list=\"{{ regions }}\" as=\"r\" hint-placeholder-count=\"6\">\n                  <button sc-camel-on-click=\"{{ r.toggle }}\" style=\"border: 1px solid {{ r.border }}; background: {{ r.bg }}; color: {{ r.fg }}; border-radius: 999px; padding: 10px 18px; font-size: 14px;\" style-hover=\"border-color: #202020;\">{{ r.label }}<\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"margin-top: 30px; display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; padding: 22px; background: #FAFAFA; border: 1px solid #E7E7E7; border-radius: 16px;\">\n              <div>\n                <p style=\"margin: 0; font-size: 15px; font-weight: 600;\">Monthly newsletter<\u002Fp>\n                <p style=\"margin: 7px 0 0; max-width: 52ch; font-size: 14.5px; line-height: 1.7; color: #6A6A6A;\">A curated round-up of upcoming events. Unsubscribe anytime.<\u002Fp>\n              <\u002Fdiv>\n              <button sc-camel-on-click=\"{{ toggleNews }}\" title=\"Toggle newsletter\" style=\"flex: 0 0 auto; width: 52px; height: 30px; border: 1px solid {{ newsBorder }}; border-radius: 999px; background: {{ newsBg }}; padding: 3px; display: flex; justify-content: {{ newsJustify }};\">\n                <span style=\"width: 22px; height: 22px; border-radius: 50%; background: {{ newsKnob }}; display: block;\"><\u002Fspan>\n              <\u002Fbutton>\n            <\u002Fdiv>\n\n            <div style=\"margin-top: 34px; display: flex; gap: 12px; flex-wrap: wrap;\">\n              <button style=\"border: 0; border-radius: 12px; background: #1E1E1E; color: #fff; padding: 15px 26px; font-size: 15px; font-weight: 600;\" style-hover=\"background: #000;\">Save changes<\u002Fbutton>\n              <button style=\"border: 1px solid #202020; background: #fff; border-radius: 12px; padding: 15px 26px; font-size: 15px; font-weight: 600; color: #202020;\" style-hover=\"background: #FAFAFA;\">Cancel<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"margin-top: 26px; border: 1px solid #E7E7E7; border-radius: 20px; padding: 36px;\">\n            <h3 style=\"margin: 0; font-family: 'Playfair Display', serif; font-weight: 600; font-size: 22px; letter-spacing: -0.01em;\">Account settings<\u002Fh3>\n            <div data-2col=\"\" style=\"margin-top: 22px;\">\n              <label style=\"display: block;\"><span style=\"display: block; font-size: 13.5px; font-weight: 600; margin-bottom: 9px;\">Current password<\u002Fspan><input type=\"password\" placeholder=\"••••••••\" style=\"width: 100%; height: 52px; border: 1px solid #E7E7E7; border-radius: 12px; padding: 0 16px; font-size: 15px; outline: none;\"><\u002Flabel>\n              <label style=\"display: block;\"><span style=\"display: block; font-size: 13.5px; font-weight: 600; margin-bottom: 9px;\">New password<\u002Fspan><input type=\"password\" placeholder=\"At least 8 characters\" style=\"width: 100%; height: 52px; border: 1px solid #E7E7E7; border-radius: 12px; padding: 0 16px; font-size: 15px; outline: none;\"><\u002Flabel>\n            <\u002Fdiv>\n            <button style=\"margin-top: 22px; border: 1px solid #202020; background: #fff; border-radius: 12px; padding: 14px 24px; font-size: 14.5px; font-weight: 600; color: #202020;\" style-hover=\"background: #FAFAFA;\">Update password<\u002Fbutton>\n            <div style=\"margin-top: 26px; padding-top: 22px; border-top: 1px solid #E7E7E7; display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap;\">\n              <p style=\"margin: 0; font-size: 14.5px; color: #6A6A6A;\">Signed in as maya@reyesstudio.com<\u002Fp>\n              <button style=\"background: none; border: 0; padding: 0; font-size: 14.5px; font-weight: 600; color: var(--accent);\" style-hover=\"color: #94733a;\">Log out<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n\n      <\u002Fsection>\n    <\u002Fdiv>\n  <\u002Fmain>\n\n  <footer style=\"background: #1E1E1E; color: rgba(255,255,255,0.72);\">\n    <div data-pad=\"\" style=\"max-width: 1440px; margin: 0 auto; padding-top: 44px; padding-bottom: 44px; display: flex; align-items: center; justify-content: space-between; gap: 28px; flex-wrap: wrap;\">\n      <div style=\"display: flex; align-items: center; gap: 12px;\">\n        <span style=\"font-family: 'Playfair Display', serif; font-size: 30px; line-height: 1; color: var(--accent);\">A<\u002Fspan>\n        <span style=\"font-size: 12px; font-weight: 700; letter-spacing: 0.14em; line-height: 1.25; color: #fff;\">ARCHITECTURE<br>EVENTS<\u002Fspan>\n      <\u002Fdiv>\n      <p style=\"margin: 0; font-size: 13.5px;\">© 2026 Architecture Events. All rights reserved.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;startTab&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;saved&quot;,&quot;history&quot;,&quot;profile&quot;],&quot;default&quot;:&quot;saved&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Demo state&quot;},&quot;savedEmpty&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Demo state&quot;},&quot;historyEmpty&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Demo state&quot;}}\">\nclass Component extends DCLogic {\n  state = {\n    tab: this.props.startTab || 'saved',\n    removed: [],\n    role: 'Architect',\n    news: true,\n    cats: ['Sustainability', 'BIM / VDC', 'Facade Systems'],\n    regions: ['New York, NY']\n  };\n\n  events = [\n    { id: 'e1', img: (window.__resources && window.__resources.ev1) || 'assets/ev1.jpg', mon: 'SEP', day: '14', year: '2026', cat: 'CONFERENCE', title: 'Facade Systems Summit 2026', city: 'New York, NY' },\n    { id: 'e2', img: (window.__resources && window.__resources.ev2) || 'assets/ev2.jpg', mon: 'SEP', day: '29', year: '2026', cat: 'PRODUCT SHOWCASE', title: 'Mass Timber & Low-Carbon Structures', city: 'Portland, OR' },\n    { id: 'e3', img: (window.__resources && window.__resources.ev3) || 'assets/ev3.jpg', mon: 'OCT', day: '08', year: '2026', cat: 'EDUCATION · CEU', title: 'Daylighting and Glazing Performance', city: 'Chicago, IL' },\n    { id: 'e4', img: (window.__resources && window.__resources.ev4) || 'assets/ev4.jpg', mon: 'OCT', day: '21', year: '2026', cat: 'NETWORKING', title: 'AEC Practice Leaders Dinner', city: 'Boston, MA' },\n    { id: 'e5', img: (window.__resources && window.__resources.ev5) || 'assets/ev5.jpg', mon: 'NOV', day: '05', year: '2026', cat: 'CONFERENCE', title: 'BIM / VDC Coordination Forum', city: 'San Diego, CA' },\n    { id: 'e6', img: (window.__resources && window.__resources.ev6) || 'assets/ev6.jpg', mon: 'NOV', day: '17', year: '2026', cat: 'EXHIBITION', title: 'Interior Materials Week', city: 'Online' }\n  ];\n\n  pastEvents = [\n    { cat: 'CONFERENCE', title: 'Adaptive Reuse Symposium', date: 'May 12, 2026', city: 'Boston, MA', status: 'Registered' },\n    { cat: 'EDUCATION · CEU', title: 'Envelope Detailing Workshop', date: 'Apr 24, 2026', city: 'Chicago, IL', status: 'Registered' },\n    { cat: 'NETWORKING', title: 'Spring Studio Mixer', date: 'Mar 30, 2026', city: 'New York, NY', status: 'Saved only' },\n    { cat: 'PRODUCT SHOWCASE', title: 'Acoustic Ceilings Product Day', date: 'Feb 18, 2026', city: 'Online', status: 'Saved only' },\n    { cat: 'CONFERENCE', title: 'Design Technology Conference', date: 'Jan 27, 2026', city: 'San Diego, CA', status: 'Registered' }\n  ];\n\n  catOptions = ['Conferences', 'Sustainability', 'Facade Systems', 'BIM / VDC', 'Interior Design', 'AI in Design', 'Networking', 'Product Showcases', 'Education / CEU'];\n  regionOptions = ['New York, NY', 'Chicago, IL', 'Boston, MA', 'San Diego, CA', 'Los Angeles, CA', 'Northeast', 'Online'];\n\n  go(tab) { this.setState({ tab: tab }); if (typeof window !== 'undefined') window.scrollTo(0, 0); }\n\n  chip(label, list, key) {\n    const on = list.indexOf(label) > -1;\n    return {\n      label: label,\n      bg: on ? '#1E1E1E' : '#fff',\n      fg: on ? '#fff' : '#202020',\n      border: on ? '#202020' : '#E7E7E7',\n      toggle: () => this.setState(s => {\n        const cur = s[key];\n        return { [key]: cur.indexOf(label) > -1 ? cur.filter(x => x !== label) : cur.concat([label]) };\n      })\n    };\n  }\n\n  renderVals() {\n    const tab = this.state.tab;\n    const saved = this.props.savedEmpty ? [] : this.events.filter(e => this.state.removed.indexOf(e.id) < 0);\n    const history = this.props.historyEmpty ? [] : this.pastEvents;\n    const act = { bg: '#F1EEE8', fg: '#202020', fw: '600' };\n    const idle = { bg: 'transparent', fg: '#6A6A6A', fw: '500' };\n    const s = tab === 'saved' ? act : idle, h = tab === 'history' ? act : idle, p = tab === 'profile' ? act : idle;\n    return {\n      isSaved: tab === 'saved', isHistory: tab === 'history', isProfile: tab === 'profile',\n      goSaved: () => this.go('saved'), goHistory: () => this.go('history'), goProfile: () => this.go('profile'),\n      savedBg: s.bg, savedFg: s.fg, savedFw: s.fw,\n      histBg: h.bg, histFg: h.fg, histFw: h.fw,\n      profBg: p.bg, profFg: p.fg, profFw: p.fw,\n      savedEvents: saved.map(e => Object.assign({}, e, {\n        remove: () => this.setState(st => ({ removed: st.removed.concat([e.id]) }))\n      })),\n      hasSaved: saved.length > 0,\n      noSaved: saved.length === 0,\n      savedCountLabel: saved.length === 0 ? 'No events saved' : (saved.length === 1 ? '1 event saved' : saved.length + ' events saved'),\n      history: history.map(r => Object.assign({}, r, r.status === 'Registered'\n        ? { pillBg: '#1E1E1E', pillFg: '#fff', pillBorder: '#202020' }\n        : { pillBg: '#fff', pillFg: '#3A3A3A', pillBorder: '#E7E7E7' })),\n      hasHistory: history.length > 0,\n      noHistory: history.length === 0,\n      histCountLabel: history.length === 0 ? 'Nothing here yet' : history.length + ' past events',\n      role: this.state.role,\n      setRole: (e) => this.setState({ role: e.target.value }),\n      categories: this.catOptions.map(c => this.chip(c, this.state.cats, 'cats')),\n      regions: this.regionOptions.map(r => this.chip(r, this.state.regions, 'regions')),\n      toggleNews: () => this.setState(st => ({ news: !st.news })),\n      newsBg: this.state.news ? '#1E1E1E' : '#fff',\n      newsBorder: this.state.news ? '#202020' : '#E7E7E7',\n      newsKnob: this.state.news ? '#fff' : '#C9C9C9',\n      newsJustify: this.state.news ? 'flex-end' : 'flex-start'\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
